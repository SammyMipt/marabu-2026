<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img"
     aria-label="Модель Бора: ядро в центре, пунктирные орбиты, один электрон на орбите">
  <!-- Левая панель слайда «не орбита, а облако» в беате 4.
       Цитата картинки из прошлой лекции курса: ядро-точка, пунктирные
       орбиты, один электрон на кольце. Ни энергий, ни квантовых чисел,
       ни фотонов — беат про геометрию, а не про излучение.

       Нарисовано с нуля, а не переделано из чужого файла. У всех трёх
       свободных кандидатов на Викискладе контраст ниже порога читаемости
       и/или подписи вросли в рисунок: доводка стоила бы столько же, сколько
       отрисовка, но тянула бы за собой чужой share-alike.

       Квадрат 1000×1000 — под пару к oblako-1s.png (1024×1024), чтобы
       в блоке row панели встали одного размера.

       Цвета продублированы из shared/theme/electron.css: <img> не наследует
       CSS-переменные страницы. При редизайне править здесь, в блоке style. -->
  <style>
    svg { --ink:#1b1b2f; --accent:#3e2f8e; --muted:#6e6e80; }
    .orbit    { fill: none; stroke: var(--muted); stroke-width: 5; stroke-dasharray: 16 14; opacity: .75; }
    .nucleus  { fill: var(--accent); }
    .electron { fill: var(--accent); }
    .halo     { fill: var(--accent); opacity: .16; }
  </style>

  <g class="orbit">
    <circle cx="500" cy="500" r="170"/>
    <circle cx="500" cy="500" r="285"/>
    <circle cx="500" cy="500" r="400"/>
  </g>

  <circle class="halo"    cx="500" cy="500" r="46"/>
  <circle class="nucleus" cx="500" cy="500" r="27"/>

  <!-- Электрон на средней орбите, угол −35°: r=285 -->
  <circle class="halo"     cx="733" cy="337" r="38"/>
  <circle class="electron" cx="733" cy="337" r="21"/>
</svg>
