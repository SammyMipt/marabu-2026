<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Две щели — электроны по одному</title>
<link rel="stylesheet" href="../shared/demo.css">
</head>
<body>
<div id="root"></div>

<script src="../shared/vendor/react.production.min.js"></script>
<script src="../shared/vendor/react-dom.production.min.js"></script>
<script src="../shared/vendor/htm.js"></script>
<script src="../shared/demo-core.js"></script>
<script>
'use strict';
var C = window.DemoCore, html = C.html;
var useRef = React.useRef, useState = React.useState;

/* ══════════════════ распределения ══════════════════

   Волновой режим считается одной формулой с параметром видности V:

       I(x) = sinc²(πx/ENV) · [1 + V·cos(2πx/PER)]

   V = 1 — полосы, V = 0 — ровно та же огибающая без модуляции. Это не
   художественная интерполяция, а формула для частичной which-way
   информации: детектор гасит именно cos, оставляя огибающую на месте.
   Поэтому при включении детектора картина не сдвигается и не сжимается,
   а полосы «тают» в собственный контур, сохраняя ширину и число точек.

   ENV подобран так, чтобы крайние из пяти ярких полос шли примерно
   вполовину центральной, как на настоящей записи 2013 года. */

var ENV = 300;     /* первый ноль огибающей, px */
var PER = 66;      /* период полос, px */

function sinc2(u){
  if (Math.abs(u) < 1e-6) return 1;
  var s = Math.sin(u) / u;
  return s * s;
}
function pdfWave(x, V){
  return sinc2(Math.PI * x / ENV) * (1 + V * Math.cos(2 * Math.PI * x / PER));
}
/* Мячики: волны нет, работает геометрия — две тени щелей.
   Это классический предел, в котором предсказание зала верно. */
var BALL_SEP = 84, BALL_W = 15;
function pdfBalls(x){
  var a = (x - BALL_SEP / 2) / BALL_W, b = (x + BALL_SEP / 2) / BALL_W;
  return Math.exp(-a * a) + Math.exp(-b * b);
}

/* ══════════════════ сцена ══════════════════ */

var W = 1000, HGT = 430;
var SCR = { x0: 356, x1: 986, y0: 40, y1: 392 };      /* экран, вид спереди */
var SCR_CX = (SCR.x0 + SCR.x1) / 2;
var MINI = { gun: 42, wall: 196, screen: 300, y: 216 }; /* схема сбоку, напоминание */

function TwoSlits(){
  var st = useRef({
    running: false, rate: 34, detector: false, balls: false,
    hits: [], count: 0, spawn: 0, V: 1, flash: 0, flashSlit: 0,
    pausedAt25: false, ghost: false
  }).current;

  var [ui, setUi] = useState({ running: false, rate: 34, detector: false, balls: false, count: 0, ghost: false });
  var [status, setStatus] = useState('Электроны полетят по одному. Что появится на экране? Спросите зал, потом жмите пуск.');

  function sync(){
    setUi({ running: st.running, rate: st.rate, detector: st.detector,
            balls: st.balls, count: st.count, ghost: st.ghost });
  }

  function reset(keepRunning){
    st.hits = []; st.count = 0; st.spawn = 0; st.pausedAt25 = false;
    if (!keepRunning) st.running = false;
    sync();
  }

  function toggleRun(){
    st.running = !st.running;
    if (st.running && st.count === 0) setStatus('Пошли по одному. Смотрите, куда попадают.');
    sync();
  }

  function toggleDetector(){
    st.detector = !st.detector;
    reset(st.running);
    setStatus(st.detector
      ? 'Детектор включён: теперь про каждый электрон известно, через какую щель он прошёл. Смотрим, что получится.'
      : 'Детектор выключен. Про путь снова ничего не известно.');
  }

  function toggleBalls(){
    st.balls = !st.balls;
    reset(st.running);
    setStatus(st.balls
      ? 'Теперь стреляем мячиками. У них волна такая короткая, что веера нет: летят прямо и дают две полоски.'
      : 'Снова электроны.');
  }

  function toggleGhost(){
    st.ghost = !st.ghost;
    sync();
    if (st.ghost) setStatus('Бледным показан прогноз зала: две полоски напротив щелей.');
  }

  function addHit(){
    var x, slit = Math.random() < 0.5 ? 0 : 1;
    if (st.balls) {
      x = C.sampleFrom(pdfBalls, -SCR_CX + SCR.x0 + 10, SCR.x1 - SCR_CX - 10, 2);
    } else {
      x = C.sampleFrom(function(t){ return pdfWave(t, st.V); },
                       -(SCR_CX - SCR.x0) + 10, (SCR.x1 - SCR_CX) - 10, 2);
    }
    st.hits.push({ x: x, y: SCR.y0 + 14 + Math.random() * (SCR.y1 - SCR.y0 - 28), slit: slit, age: 0 });
    st.count++;
    if (st.hits.length > 4000) st.hits.shift();
    if (st.detector) { st.flash = 1; st.flashSlit = slit; }
  }

  function step(dt){
    /* видность гаснет плавно: полосы должны РАСТАЯТЬ на месте */
    var target = st.detector ? 0 : 1;
    if (st.V !== target) {
      var d = target - st.V;
      st.V += Math.sign(d) * Math.min(Math.abs(d), dt * 1.6);
    }
    if (st.flash > 0) st.flash -= dt * 2.6;
    st.hits.forEach(function(h){ if (h.age < 1) h.age += dt * 3; });

    if (!st.running) return;
    st.spawn += st.rate * dt;
    while (st.spawn >= 1) { st.spawn -= 1; addHit(); }

    /* Обязательная остановка на середине третьего десятка: зал ещё видит
       случайную сыпь и должен вслух сказать, что полосок не видно. */
    if (!st.pausedAt25 && st.count >= 25 && !st.balls && !st.detector) {
      st.pausedAt25 = true; st.running = false;
      setStatus('Двадцать пять попаданий. Ну как, видите две полоски? Пока просто случайные точки. Продолжаем.');
      sync();
    }
  }

  function draw(ctx){
    /* ── схема сбоку: пушка, две щели, экран ── */
    ctx.strokeStyle = '#b9b9c6'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(MINI.gun + 26, MINI.y); ctx.lineTo(MINI.wall - 4, MINI.y); ctx.stroke();
    C.roundRect(ctx, MINI.gun - 20, MINI.y - 20, 46, 40, 7);
    ctx.fillStyle = '#f2f0fb'; ctx.fill(); ctx.strokeStyle = '#3e2f8e'; ctx.stroke();
    /* стенка со щелями */
    ctx.fillStyle = '#3e2f8e';
    ctx.fillRect(MINI.wall, MINI.y - 96, 9, 74);
    ctx.fillRect(MINI.wall, MINI.y - 8, 9, 16);
    ctx.fillRect(MINI.wall, MINI.y + 22, 9, 74);
    /* лучи к экрану */
    ctx.strokeStyle = 'rgba(62,47,142,.28)'; ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(MINI.wall + 9, MINI.y - 16); ctx.lineTo(MINI.screen, MINI.y - 60);
    ctx.moveTo(MINI.wall + 9, MINI.y - 16); ctx.lineTo(MINI.screen, MINI.y + 60);
    ctx.moveTo(MINI.wall + 9, MINI.y + 16); ctx.lineTo(MINI.screen, MINI.y - 60);
    ctx.moveTo(MINI.wall + 9, MINI.y + 16); ctx.lineTo(MINI.screen, MINI.y + 60);
    ctx.stroke(); ctx.setLineDash([]);
    C.label(ctx, MINI.gun + 3, MINI.y + 46, 'пушка', 14, '#6e6e80');
    C.label(ctx, MINI.wall + 5, MINI.y + 118, 'две щели', 14, '#6e6e80');

    /* детекторы у щелей */
    if (st.detector) {
      [-1, 1].forEach(function(sgn, i){
        var yy = MINI.y + sgn * 16, lit = st.flash > 0 && st.flashSlit === (sgn < 0 ? 0 : 1);
        ctx.beginPath(); ctx.arc(MINI.wall + 26, yy, 9, 0, 6.284);
        ctx.fillStyle = lit ? 'rgba(192,57,43,' + (0.35 + 0.65 * st.flash) + ')' : '#f6dcd8';
        ctx.fill();
        ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 2; ctx.stroke();
      });
      C.label(ctx, MINI.wall + 30, MINI.y - 116, 'следим', 14, '#c0392b');
    }

    /* ── экран ── */
    C.roundRect(ctx, SCR.x0, SCR.y0, SCR.x1 - SCR.x0, SCR.y1 - SCR.y0, 10);
    ctx.fillStyle = '#14141f'; ctx.fill();

    /* призрак прогноза зала */
    if (st.ghost) {
      ctx.fillStyle = 'rgba(255,255,255,.09)';
      [-BALL_SEP / 2, BALL_SEP / 2].forEach(function(dx){
        ctx.fillRect(SCR_CX + dx - BALL_W, SCR.y0 + 8, BALL_W * 2, SCR.y1 - SCR.y0 - 16);
      });
      C.label(ctx, SCR_CX, SCR.y0 + 26, 'прогноз зала', 14, 'rgba(255,255,255,.5)');
    }

    /* попадания */
    st.hits.forEach(function(h){
      var a = Math.min(1, h.age);
      var col = st.detector
        ? (h.slit ? 'rgba(255,196,120,' : 'rgba(140,210,255,')      /* цвет щели, которую назвал детектор */
        : 'rgba(233,233,255,';
      ctx.fillStyle = col + (0.55 + 0.45 * a) + ')';
      var r = 2.6 + (1 - a) * 5;                                     /* свежая вспышка крупнее */
      ctx.beginPath(); ctx.arc(SCR_CX + h.x, h.y, r, 0, 6.284); ctx.fill();
    });

    /* счётчик */
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,.86)';
    ctx.font = '600 22px system-ui, sans-serif';
    ctx.fillText('электронов: ' + st.count, SCR.x1 - 18, SCR.y1 - 16);
    ctx.textAlign = 'center';
  }

  var ref = C.useStage(W, HGT, step, draw);
  window.__demoState = st;

  return html`
    <div class="demo">
      <div class="controls">
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${toggleRun}>${ui.running ? 'Пауза' : 'Пуск'}<//>
          <${C.Btn} onClick=${function(){ reset(false); setStatus('Экран чист. Начинаем заново.'); }}>Сброс<//>
        <//>
        <${C.Group} label="Детектор у щели:">
          <${C.Btn} active=${ui.detector} onClick=${toggleDetector}>${ui.detector ? 'следит' : 'выключен'}<//>
        <//>
        <${C.Group} label="Стреляем:">
          <${C.Btn} active=${ui.balls} onClick=${toggleBalls}>${ui.balls ? 'мячиками' : 'электронами'}<//>
        <//>
        <${C.Group}>
          <${C.Btn} active=${ui.ghost} onClick=${toggleGhost}>Прогноз зала<//>
        <//>
        <${C.Slider} label="Темп:" min=${4} max=${160} step=${2} value=${ui.rate}
                     onChange=${function(v){ st.rate = v; sync(); }}
                     display=${Math.round(ui.rate) + '/с'} />
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${status} />
    </div>`;
}

C.mount(TwoSlits);
</script>
</body>
</html>
