<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Две щели — электроны по одному</title>
<link rel="stylesheet" href="../shared/demo.css">
</head>
<body>
<div id="root"></div>

<script src="../shared/vendor/react.production.min.js"></script>
<script src="../shared/vendor/react-dom.production.min.js"></script>
<script src="../shared/vendor/htm.js"></script>
<script src="../shared/demo-core.js"></script>
<script>
'use strict';
var C = window.DemoCore, html = C.html;
var useRef = React.useRef, useState = React.useState;

/* ══════════════════ распределения ══════════════════

   Волновой режим считается одной формулой с параметром видности V:

       I(x) = sinc²(πx/ENV) · [1 + V·cos(2πx/PER)]

   V = 1 — полосы, V = 0 — ровно та же огибающая без модуляции. Это не
   художественная интерполяция, а формула для частичной which-way
   информации: детектор гасит именно cos, оставляя огибающую на месте.
   Поэтому при включении детектора картина не сдвигается и не сжимается,
   а полосы «тают» в собственный контур, сохраняя ширину и число точек.

   ENV подобран так, чтобы крайние из пяти ярких полос шли примерно
   вполовину центральной, как на настоящей записи 2013 года. */

var ENV = 300;     /* первый ноль огибающей, px */
var PER = 66;      /* период полос, px */

function sinc2(u){
  if (Math.abs(u) < 1e-6) return 1;
  var s = Math.sin(u) / u;
  return s * s;
}
function pdfWave(x, V){
  return sinc2(Math.PI * x / ENV) * (1 + V * Math.cos(2 * Math.PI * x / PER));
}
/* Мячики: волны нет, работает геометрия — две тени щелей.
   Это классический предел, в котором предсказание зала верно. */
var BALL_SEP = 84, BALL_W = 15;
function pdfBalls(x){
  var a = (x - BALL_SEP / 2) / BALL_W, b = (x + BALL_SEP / 2) / BALL_W;
  return Math.exp(-a * a) + Math.exp(-b * b);
}

/* ══════════════════ сцена ══════════════════

   Кадр делится на две части, и обе действующие, а не декоративные:

   слева  — прибор в разрезе. Электрон реально летит: пушка → щель → экран.
            Пока он в пути, на экране ничего нет. Вспышка появляется
            в момент попадания, а не «сама по себе»: беат стоит на том,
            что в приборе за раз находится ОДИН электрон.
   справа — тот же экран, но спереди, во весь рост. Под ним профиль
            накопления, посчитанный по реальным попаданиям: полосы
            становятся не «видом», а измерением.

   Пунктир между разрезом и экраном говорит «это одно и то же место,
   повёрнутое к нам». */

var W = 1000, HGT = 430;

var GUN = { x: 26, y: 196 };                            /* разрез, вид сбоку */
var WALL_X = 236, SLIT_DY = 15, EDGE_X = 292;
var SCR = { x0: 330, x1: 980, y0: 26, y1: 344 };        /* экран, вид спереди */
var SCR_CX = (SCR.x0 + SCR.x1) / 2;
var PROF = { y0: 374, y1: 420 };                        /* профиль накопления */
var FLIGHT = .42;                                        /* секунд на пролёт */

/* Цвет попадания говорит, что мы знаем о пути. Без детектора он один —
   тот же, что у пучка из пушки: путь не определён, различать нечего.
   С детектором каждая щель получает свой цвет, и точка на экране светится
   ровно цветом того детектора, который её назвал. */
var BEAM = '255,180,84';
var DET = ['122,166,255', '255,122,102'];
var BINS = 72;

function TwoSlits(){
  var st = useRef({
    running: false, rate: 34, detector: false, balls: false,
    hits: [], count: 0, spawn: 0, V: 1, flash: 0, flashSlit: 0,
    pausedAt25: false, ghost: false, flying: [], muzzle: 0
  }).current;

  var [ui, setUi] = useState({ running: false, rate: 34, detector: false, balls: false, count: 0, ghost: false });
  var [status, setStatus] = useState('Электроны полетят по одному. Что появится на экране?');

  function sync(){
    setUi({ running: st.running, rate: st.rate, detector: st.detector,
            balls: st.balls, count: st.count, ghost: st.ghost });
  }

  function reset(keepRunning){
    st.hits = []; st.count = 0; st.spawn = 0; st.pausedAt25 = false; st.flying = [];
    if (!keepRunning) st.running = false;
    sync();
  }

  function toggleRun(){
    st.running = !st.running;
    if (st.running && st.count === 0) setStatus('Пошли по одному. Смотрите, куда попадают.');
    sync();
  }

  function toggleDetector(){
    st.detector = !st.detector;
    reset(st.running);
    setStatus(st.detector
      ? 'Детектор включён: теперь про каждый электрон известно, через какую щель он прошёл. Смотрим, что получится.'
      : 'Детектор выключен. Про путь снова ничего не известно.');
  }

  function toggleBalls(){
    st.balls = !st.balls;
    reset(st.running);
    setStatus(st.balls
      ? 'Теперь стреляем мячиками. У них волна такая короткая, что веера нет: летят прямо и дают две полоски.'
      : 'Снова электроны.');
  }

  function toggleGhost(){
    st.ghost = !st.ghost;
    sync();
    if (st.ghost) setStatus('Бледным показан прогноз зала: две полоски напротив щелей.');
  }

  /* Куда попадёт — решает распределение, ровно как раньше.
     Изменился только момент, когда точка становится видимой. */
  function pickHit(){
    var x, slit = Math.random() < 0.5 ? 0 : 1;
    if (st.balls) {
      x = C.sampleFrom(pdfBalls, -SCR_CX + SCR.x0 + 10, SCR.x1 - SCR_CX - 10, 2);
    } else {
      x = C.sampleFrom(function(t){ return pdfWave(t, st.V); },
                       -(SCR_CX - SCR.x0) + 10, (SCR.x1 - SCR_CX) - 10, 2);
    }
    return { x: x, y: SCR.y0 + 14 + Math.random() * (SCR.y1 - SCR.y0 - 28), slit: slit, age: 0 };
  }

  function land(h){
    st.hits.push(h);
    st.count++;
    if (st.hits.length > 4000) st.hits.shift();
    if (st.detector) { st.flash = 1; st.flashSlit = h.slit; }
  }

  /* В приборе за раз ОДИН объект — на этом стоит весь беат. Пока он в пути,
     новых в разрезе не показываем: остальные попадания приходят на экран
     сразу, иначе картинка начинает врать про суть опыта.

     kind решает, что зал видит между стенкой и экраном:
       ball — мячик, целиком и всегда один, путь известен;
       det  — электрон под присмотром: путь тоже известен, детектор его назвал;
       wave — электрон без присмотра: у стенки расплывается в облако и
              собирается в точку только в момент попадания. */
  function launch(){
    var h = pickHit();
    st.muzzle = 1;
    var kind = st.balls ? 'ball' : (st.detector ? 'det' : 'wave');
    if (!st.flying.length) st.flying.push({ p: 0, hit: h, kind: kind });
    else land(h);
  }

  function step(dt){
    /* видность гаснет плавно: полосы должны РАСТАЯТЬ на месте */
    var target = st.detector ? 0 : 1;
    if (st.V !== target) {
      var d = target - st.V;
      st.V += Math.sign(d) * Math.min(Math.abs(d), dt * 1.6);
    }
    if (st.flash > 0) st.flash -= dt * 2.6;
    if (st.muzzle > 0) st.muzzle -= dt * 3.4;
    st.hits.forEach(function(h){ if (h.age < 1) h.age += dt * 3; });

    for (var i = st.flying.length - 1; i >= 0; i--) {
      st.flying[i].p += dt / FLIGHT;
      if (st.flying[i].p >= 1) { land(st.flying[i].hit); st.flying.splice(i, 1); }
    }

    if (!st.running) return;
    st.spawn += st.rate * dt;
    while (st.spawn >= 1) { st.spawn -= 1; launch(); }

    /* Обязательная остановка на середине третьего десятка: зал ещё видит
       случайную сыпь и должен вслух сказать, что полосок не видно. */
    if (!st.pausedAt25 && st.count >= 25 && !st.balls && !st.detector) {
      st.pausedAt25 = true; st.running = false;
      setStatus('Двадцать пять попаданий. Ну как, видите две полоски? Пока просто случайные точки. Продолжаем.');
      sync();
    }
  }

  /* ── примитивы ── */

  function glow(ctx, x, y, r, rgb, a){
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
    g.addColorStop(.35, 'rgba(' + rgb + ',' + (a * .5) + ')');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.284); ctx.fill();
  }

  /* Электронная пушка, а не квадратик: нить накала, анод с апертурой,
     сужающийся корпус. Ровно то, что стоит в трубке из беата 2. */
  function drawGun(ctx){
    var x = GUN.x, y = GUN.y;

    ctx.beginPath();                       /* корпус, сужается к аноду */
    ctx.moveTo(x, y - 27);
    ctx.lineTo(x + 44, y - 27);
    ctx.lineTo(x + 62, y - 11);
    ctx.lineTo(x + 62, y + 11);
    ctx.lineTo(x + 44, y + 27);
    ctx.lineTo(x, y + 27);
    ctx.closePath();
    ctx.fillStyle = '#141a28';
    ctx.fill();
    ctx.strokeStyle = '#4a5268'; ctx.lineWidth = 2; ctx.stroke();

    /* нить накала: греется всегда, вспыхивает на выстреле */
    var heat = .55 + .45 * Math.max(0, st.muzzle);
    glow(ctx, x + 15, y, 18, '255,154,90', .3 * heat);
    ctx.strokeStyle = 'rgba(255,' + Math.round(150 + 60 * heat) + ',90,' + (.6 + .4 * heat) + ')';
    ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i <= 6; i++) {
      var px = x + 9 + i * 2.6, py = y + (i % 2 ? 9 : -9);
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();

    /* анод с апертурой */
    ctx.fillStyle = '#ffb454';
    ctx.fillRect(x + 44, y - 24, 4, 17);
    ctx.fillRect(x + 44, y + 7, 4, 17);

    /* горловина и апертура */
    ctx.strokeStyle = '#4a5268'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 62, y - 5); ctx.lineTo(x + 74, y - 5);
    ctx.moveTo(x + 62, y + 5); ctx.lineTo(x + 74, y + 5); ctx.stroke();

    if (st.muzzle > 0) glow(ctx, x + 74, y, 24 * st.muzzle, BEAM, .65 * st.muzzle);
  }

  function drawSection(ctx){
    var slitY = [GUN.y - SLIT_DY, GUN.y + SLIT_DY];

    /* ствол */
    ctx.strokeStyle = '#39415a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(GUN.x + 74, GUN.y); ctx.lineTo(WALL_X - 6, GUN.y); ctx.stroke();

    drawGun(ctx);

    /* стенка со щелями */
    ctx.fillStyle = '#ffb454';
    ctx.fillRect(WALL_X, GUN.y - 128, 9, 128 - SLIT_DY - 8);
    ctx.fillRect(WALL_X, GUN.y - SLIT_DY + 8, 9, 2 * SLIT_DY - 16);
    ctx.fillRect(WALL_X, GUN.y + SLIT_DY + 8, 9, 120 - SLIT_DY);

    /* край экрана в разрезе */
    ctx.fillStyle = '#39415a';
    ctx.fillRect(EDGE_X, GUN.y - 128, 6, 250);

    /* «это одно и то же место, повёрнутое к нам» */
    ctx.strokeStyle = 'rgba(236,238,246,.16)'; ctx.setLineDash([4, 7]); ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(EDGE_X + 6, GUN.y - 128); ctx.lineTo(SCR.x0, SCR.y0);
    ctx.moveTo(EDGE_X + 6, GUN.y + 122); ctx.lineTo(SCR.x0, SCR.y1);
    ctx.stroke(); ctx.setLineDash([]);

    C.label(ctx, GUN.x + 26, GUN.y + 48, 'пушка', 18, '#8c93ac');
    C.label(ctx, WALL_X + 5, GUN.y + 148, 'две щели', 18, '#8c93ac');

    /* детекторы у щелей */
    if (st.detector) {
      [0, 1].forEach(function(s){
        var lit = st.flash > 0 && st.flashSlit === s;
        if (lit) glow(ctx, WALL_X + 28, slitY[s], 26 * st.flash, DET[s], .6 * st.flash);
        ctx.beginPath(); ctx.arc(WALL_X + 28, slitY[s], 10, 0, 6.284);
        ctx.fillStyle = 'rgba(' + DET[s] + ',' + (lit ? 0.35 + 0.65 * st.flash : .14) + ')';
        ctx.fill();
        ctx.strokeStyle = 'rgb(' + DET[s] + ')'; ctx.lineWidth = 2; ctx.stroke();
      });
      C.label(ctx, WALL_X - 14, GUN.y + 74, 'следим', 18, '#8c93ac', 'right');
    }

    /* то, что летит прямо сейчас */
    st.flying.forEach(function(f){
      var known = f.kind !== 'wave';            /* путь известен: мячик или под присмотром */
      var rgb = f.kind === 'det' ? DET[f.hit.slit] : BEAM;
      var sy = slitY[f.hit.slit];
      var x0 = GUN.x + 74;

      if (f.p < .55) {
        /* до стенки — компактный объект. Без присмотра он идёт по осевой:
           говорить, к какой щели он летит, нечем. */
        var k = f.p / .55;
        var aimY = known ? sy : GUN.y;
        var x = x0 + k * (WALL_X + 4 - x0);
        var y = GUN.y + k * (aimY - GUN.y);
        glow(ctx, x, y, f.kind === 'ball' ? 13 : 16, rgb, .5);
        ctx.fillStyle = 'rgb(' + rgb + ')';
        ctx.beginPath(); ctx.arc(x, y, f.kind === 'ball' ? 4.6 : 3.4, 0, 6.284); ctx.fill();
        return;
      }

      var k2 = (f.p - .55) / .45;

      if (known) {
        /* путь известен — за стенкой всё та же одна частица */
        var xk = WALL_X + 4 + k2 * (EDGE_X - WALL_X - 4);
        var yk = sy + k2 * (f.hit.y - sy) * .18;
        glow(ctx, xk, yk, f.kind === 'ball' ? 13 : 16, rgb, .5);
        ctx.fillStyle = 'rgb(' + rgb + ')';
        ctx.beginPath(); ctx.arc(xk, yk, f.kind === 'ball' ? 4.6 : 3.4, 0, 6.284); ctx.fill();
        return;
      }

      /* без присмотра: у щелей объект расплывается в облако и идёт сразу
         через обе. Точкой он снова становится только на экране. */
      var span = WALL_X + 4, len = EDGE_X - span;
      for (var j = 0; j < 26; j++) {
        var u = j / 25;
        var t2 = k2 * (.55 + .45 * ((j * 7919) % 100) / 100);   /* фронт неровный */
        var xw = span + t2 * len;
        var yw = GUN.y + (u - .5) * 2 * (SLIT_DY + t2 * 84) * (1 - .25 * Math.random());
        glow(ctx, xw, yw, 11, rgb, .17 + .16 * (1 - k2));
      }
      /* два ручья от щелей — метка того, что прошло через обе */
      [0, 1].forEach(function(s){
        glow(ctx, span + k2 * len * .5, slitY[s], 14, rgb, .26);
      });
    });
  }

  function drawScreen(ctx){
    /* люминофорное поле */
    C.roundRect(ctx, SCR.x0, SCR.y0, SCR.x1 - SCR.x0, SCR.y1 - SCR.y0, 8);
    ctx.fillStyle = '#03050b'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,180,84,.18)'; ctx.lineWidth = 1.5; ctx.stroke();

    /* призрак прогноза зала */
    if (st.ghost) {
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      [-BALL_SEP / 2, BALL_SEP / 2].forEach(function(dx){
        ctx.fillRect(SCR_CX + dx - BALL_W, SCR.y0 + 6, BALL_W * 2, SCR.y1 - SCR.y0 - 12);
      });
      C.label(ctx, SCR_CX, SCR.y0 + 28, 'прогноз зала', 18, 'rgba(255,255,255,.55)');
    }

    /* попадания: старые — плоские точки, свежие — вспышка с ореолом */
    ctx.save();
    for (var i = 0; i < st.hits.length; i++) {
      var h = st.hits[i], a = Math.min(1, h.age);
      var rgb = st.detector ? DET[h.slit] : BEAM;
      if (a < 1) glow(ctx, SCR_CX + h.x, h.y, 8 * (1 - a) + 3, rgb, .45 * (1 - a) + .12);
      ctx.fillStyle = 'rgba(' + rgb + ',' + (0.5 + 0.4 * a) + ')';
      ctx.beginPath(); ctx.arc(SCR_CX + h.x, h.y, 2.3, 0, 6.284); ctx.fill();
    }
    ctx.restore();

    /* счётчик как индикатор прибора, а не подпись */
    ctx.textAlign = 'right';
    ctx.font = '600 15px "JetBrains Mono", ui-monospace, monospace';
    ctx.fillStyle = '#8c93ac';
    ctx.fillText('ЭЛЕКТРОНОВ', SCR.x1 - 16, SCR.y0 + 28);
    ctx.font = '600 32px "JetBrains Mono", ui-monospace, monospace';
    ctx.fillStyle = '#ffb454';
    ctx.fillText(String(st.count), SCR.x1 - 16, SCR.y0 + 66);
    ctx.textAlign = 'center';
  }

  /* Профиль по РЕАЛЬНЫМ попаданиям: зал видит не «картинку полос»,
     а измерение, которое само собой вылезает из точек. */
  function drawProfile(ctx){
    var bins = new Array(BINS), i, max = 0;
    for (i = 0; i < BINS; i++) bins[i] = 0;
    var span = SCR.x1 - SCR.x0;
    for (i = 0; i < st.hits.length; i++) {
      var k = Math.floor((st.hits[i].x + span / 2) / span * BINS);
      if (k >= 0 && k < BINS) bins[k]++;
    }
    for (i = 0; i < BINS; i++) if (bins[i] > max) max = bins[i];

    ctx.strokeStyle = 'rgba(236,238,246,.12)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(SCR.x0, PROF.y1); ctx.lineTo(SCR.x1, PROF.y1); ctx.stroke();

    if (max > 0) {
      var bw = span / BINS;
      for (i = 0; i < BINS; i++) {
        if (!bins[i]) continue;
        var hh = (bins[i] / max) * (PROF.y1 - PROF.y0);
        ctx.fillStyle = 'rgba(255,180,84,.55)';
        ctx.fillRect(SCR.x0 + i * bw + .6, PROF.y1 - hh, bw - 1.2, hh);
      }
    }
    C.label(ctx, SCR.x0 + 96, PROF.y0 - 10, 'сколько куда попало', 18, '#8c93ac');
  }

  function draw(ctx){
    drawSection(ctx);
    drawScreen(ctx);
    drawProfile(ctx);
  }

  var ref = C.useStage(W, HGT, step, draw);
  window.__demoState = st;

  return html`
    <div class="demo">
      <div class="controls">
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${toggleRun}>${ui.running ? 'Пауза' : 'Пуск'}<//>
          <${C.Btn} onClick=${function(){ reset(false); setStatus('Экран чист. Начинаем заново.'); }}>Сброс<//>
        <//>
        <${C.Group} label="Детектор у щели:">
          <${C.Btn} active=${ui.detector} onClick=${toggleDetector}>${ui.detector ? 'следит' : 'выключен'}<//>
        <//>
        <${C.Group} label="Стреляем:">
          <${C.Btn} active=${ui.balls} onClick=${toggleBalls}>${ui.balls ? 'мячиками' : 'электронами'}<//>
        <//>
        <${C.Group}>
          <${C.Btn} active=${ui.ghost} onClick=${toggleGhost}>Прогноз зала<//>
        <//>
        <${C.Slider} label="Темп:" min=${4} max=${160} step=${2} value=${ui.rate}
                     onChange=${function(v){ st.rate = v; sync(); }}
                     display=${Math.round(ui.rate) + '/с'} />
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${status} />
    </div>`;
}

C.mount(TwoSlits);
</script>
</body>
</html>
